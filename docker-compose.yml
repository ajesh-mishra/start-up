services:

  angular-frontend:
    build:
      context: ./angular-frontend
      dockerfile: Dockerfile
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "4200:80"
    depends_on:
      fastapi-backend:
        condition: service_healthy
    networks:
      - app-network

  fastapi-backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    env_file:
      - ./fastapi-backend/.env
    environment:
      RUN_CONTEXT: docker-compose
    command: ["bash", "start.sh"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres-database:
        condition: service_healthy
    networks:
      - app-network

  postgres-database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purchases
    volumes:
      - ./postgres-database/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  cloudflare-daemon:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - angular-frontend
    networks:
      - app-network

networks:
  app-network: